# This workflow will triage pull requests and apply a label based on the
# paths that are modified in the pull request.
#
# To use this workflow, you will need to set up a .github/labeler.yml
# file with configuration.  For more information, see:
# https://github.com/actions/labeler/blob/master/README.md

name: "Pull Request Labeler"
on: pull_request_target

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
    # pull_request_target has no commits payload (that field is for push events),
    # so check the PR title, body, and commit messages explicitly.
    - name: Detect [skip ci]
      id: skip
      uses: actions/github-script@v7
      with:
        script: |
          const pr = context.payload.pull_request;
          const { data: commits } = await github.rest.pulls.listCommits({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: pr.number,
            per_page: 100,
          });
          const haystack = [
            pr.title || '',
            pr.body || '',
            ...commits.map((c) => c.commit.message || ''),
          ].join('\n');
          const skip = /\[(?:skip ci|ci skip)\]/i.test(haystack);
          core.setOutput('skip', String(skip));

    - uses: actions/labeler@v2
      if: steps.skip.outputs.skip != 'true'
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
